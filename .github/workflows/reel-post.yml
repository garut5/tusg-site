name: TUSG daily reel — エミリー (18:41 JST)

# 毎日 18:41 JST (= 09:41 UTC)。TUSG AI ナビゲーター『エミリー』が案内する
# リール動画を生成し、Instagram に投稿する。
#
# ■ 開示ポリシー (必須遵守)
#   エミリーは AI 生成の架空キャラクター。全キャプションに
#   「※本投稿は AI ナビゲーター エミリー が案内しています」を明記。
#   Instagram bio でも AI ナビゲーターであることを明記すること。
#
# ■ 時刻
#   19:41 JST のカルーセルより 1 時間早く。同日の同じネタで
#   リール → カルーセル の順に露出させる (LOCOREACH パターン)。
#
# ■ 安全ゲート
#   AUTOPOST_LIVE=true でのみ実投稿、それ以外は dry_run。
#   workflow_dispatch のデフォルトも dry_run=true。

on:
  schedule:
    - cron: '41 9 * * *'  # 18:41 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry_run で試す (投稿しない)'
        type: choice
        options: ['true', 'false']
        default: 'true'
      slug:
        description: '特定 slug でテスト (空なら今日のジャンルから自動)'
        required: false
        default: ''
      skip_did:
        description: 'D-ID を呼ばず、narration 組立確認のみ'
        type: choice
        options: ['true', 'false']
        default: 'false'

concurrency:
  group: tusg-reel
  cancel-in-progress: false

permissions:
  contents: write   # posted.json 更新のため

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 実投稿判定
        id: mode
        env:
          LIVE: ${{ secrets.AUTOPOST_LIVE }}
          DISPATCH_DRY: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$DISPATCH_DRY" = "false" ] && [ "$LIVE" = "true" ]; then
              echo "dry_run=false" >> "$GITHUB_OUTPUT"
            else
              echo "dry_run=true" >> "$GITHUB_OUTPUT"
            fi
          else
            if [ "$LIVE" = "true" ]; then
              echo "dry_run=false" >> "$GITHUB_OUTPUT"
            else
              echo "dry_run=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: リール動画を生成 (D-ID lip-sync)
        id: make
        env:
          DID_API_KEY: ${{ secrets.DID_API_KEY }}
          EMILY_PORTRAIT_URL: ${{ secrets.EMILY_PORTRAIT_URL || 'https://tusg.site/assets/emily/portrait-01.jpg' }}
          EMILY_VOICE: ${{ secrets.EMILY_VOICE || 'ja-JP-NanamiNeural' }}
        run: |
          extra=""
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            extra="--slug ${{ github.event.inputs.slug }}"
          fi
          if [ "${{ github.event.inputs.skip_did }}" = "true" ]; then
            extra="$extra --dry-run"
            echo "skip_did=true"
          fi
          python3 scripts/make_reel.py --outdir out/reel $extra
          echo "slug=$(python3 -c "import json;print(json.load(open('out/reel/reel.json',encoding='utf-8'))['slug'])")" >> "$GITHUB_OUTPUT"

      - name: 同じ slug を二度出さない (reel チャネル)
        id: dedupe
        if: ${{ github.event.inputs.skip_did != 'true' }}
        run: |
          git fetch -q origin "${GITHUB_REF_NAME}"
          git checkout -q "origin/${GITHUB_REF_NAME}" -- posted.json
          if python3 scripts/posted.py check --channel reel --item out/reel/reel.json; then
            echo "fresh=1" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 動画を R2 へアップロード
        id: upload
        if: ${{ steps.dedupe.outputs.fresh == '1' && github.event.inputs.skip_did != 'true' }}
        env:
          AUTOPOST_TRIGGER_TOKEN: ${{ secrets.AUTOPOST_TRIGGER_TOKEN }}
          SITE_URL: https://tusg.site
        run: |
          python3 tools/upload_r2.py out/reel --prefix reel

      - name: 動画 URL が本当に返るか確かめる
        if: ${{ steps.dedupe.outputs.fresh == '1' && github.event.inputs.skip_did != 'true' }}
        run: |
          python3 - <<'PY'
          import json, sys, urllib.request
          d = json.load(open("out/reel/reel.json", encoding="utf-8"))
          url = d["video_url"]
          req = urllib.request.Request(url, method="HEAD",
                                       headers={"User-Agent": "tusg-autopost/1.0"})
          with urllib.request.urlopen(req, timeout=30) as r:
              if r.status != 200:
                  sys.exit(f"{url} が {r.status} を返しました")
          print("✓ video_url は取得可能")
          PY

      - name: 投稿する (or dry_run)
        if: ${{ steps.dedupe.outputs.fresh == '1' && github.event.inputs.skip_did != 'true' }}
        env:
          AUTOPOST_TRIGGER_TOKEN: ${{ secrets.AUTOPOST_TRIGGER_TOKEN }}
          SITE_URL: https://tusg.site
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          python3 tools/publish_reel.py out/reel

      - name: 投稿済みとして記録する
        if: ${{ success() && steps.dedupe.outputs.fresh == '1' && steps.mode.outputs.dry_run != 'true' && github.event.inputs.skip_did != 'true' }}
        run: |
          for i in 1 2 3 4; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            python3 scripts/posted.py record --channel reel --item out/reel/reel.json
            git add posted.json
            if git diff --cached --quiet; then echo "記録する変更なし"; exit 0; fi
            git -c user.name="tusg-autopost-bot" -c user.email="info@tusg.site" \
                commit -q -m "chore(autopost): リール $(jq -r .slug out/reel/reel.json) を投稿済みとして記録"
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push 失敗、$((2 ** i))秒後に再試行 ($i/4)"
            sleep $((2 ** i))
          done
          echo "push できませんでした"; exit 1

      - name: 失敗を Google Chat へ知らせる
        if: failure()
        env:
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          WF_NAME: ${{ github.workflow }}
          WF_REPO: ${{ github.repository }}
          WF_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLUG: ${{ steps.make.outputs.slug }}
        run: |
          if [ -z "$NOTIFY_WEBHOOK" ]; then
            echo "NOTIFY_WEBHOOK 未設定、通知しません"
            exit 0
          fi
          msg=$(printf '⚠️ %s / %s が失敗しました (slug=%s)\n%s' \
            "$WF_REPO" "$WF_NAME" "$SLUG" "$WF_URL")
          body=$(MSG="$msg" python3 -c "import json,os; print(json.dumps({'text': os.environ['MSG']}))")
          http=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            -d "$body" "$NOTIFY_WEBHOOK" || echo "0")
          echo "通知しました (HTTP $http)"
