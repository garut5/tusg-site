name: Credentials check (手動、値を出さず有無だけ)

# ■ このワークフローの目的
#
# GitHub Actions の Secrets は書き込み専用で、設定した本人ですら値を
# 読み返せない。それゆえ、運用中に「何が入っていて何が足りないか」
# を確かめる手段が必要になる。
#
# ■ 絶対にしないこと
#
# 値を echo / printf / cat しない。GitHub の *** マスクは万能ではなく、
# 分割・加工されると素通りする (LOCOREACH_AI の教訓)。
# ここでは「set / unset」だけを出す。
#
# ■ 使い方
#
# Actions タブ → "Credentials check" → Run workflow
# → job の実行ログを開いて、各 Secret の有無を確認する

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 有無だけ一覧する (値は絶対に出さない)
        env:
          AUTOPOST_TRIGGER_TOKEN: ${{ secrets.AUTOPOST_TRIGGER_TOKEN }}
          AUTOPOST_LIVE: ${{ secrets.AUTOPOST_LIVE }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          DID_API_KEY: ${{ secrets.DID_API_KEY }}
          EMILY_PORTRAIT_URL: ${{ secrets.EMILY_PORTRAIT_URL }}
          EMILY_VOICE: ${{ secrets.EMILY_VOICE }}
        run: |
          set +x
          echo "== TUSG autopost credentials =="
          echo "(値そのものは出さず、set / unset と長さだけ表示します)"
          echo ""
          for name in AUTOPOST_TRIGGER_TOKEN AUTOPOST_LIVE NOTIFY_WEBHOOK DID_API_KEY EMILY_PORTRAIT_URL EMILY_VOICE; do
            val="${!name}"
            if [ -n "$val" ]; then
              if [ "$name" = "AUTOPOST_LIVE" ]; then
                if [ "$val" = "true" ]; then
                  printf "  %-30s ✅ set (LIVE モード有効)\n" "$name"
                else
                  printf "  %-30s ✅ set (dry_run モード = 実投稿しない)\n" "$name"
                fi
              elif [ "$name" = "EMILY_VOICE" ] || [ "$name" = "EMILY_PORTRAIT_URL" ]; then
                # 音声名・URL は機密ではないので値を出す
                printf "  %-30s ✅ set (%s)\n" "$name" "$val"
              else
                printf "  %-30s ✅ set (%d chars)\n" "$name" "${#val}"
              fi
            else
              printf "  %-30s ❌ unset\n" "$name"
            fi
          done
          echo ""
          echo "== 補足 =="
          echo "  AUTOPOST_TRIGGER_TOKEN: /api/autopost/* への Bearer (Cloudflare と同じ値)"
          echo "  AUTOPOST_LIVE:          'true' で本番投稿、それ以外は dry_run"
          echo "  NOTIFY_WEBHOOK:         失敗時 Google Chat 通知先 (任意)"
          echo "  DID_API_KEY:            D-ID API キー (リール投稿に必須)"
          echo "  EMILY_PORTRAIT_URL:     エミリー画像の公開 URL (デフォルト tusg.site/assets/emily/portrait-01.jpg)"
          echo "  EMILY_VOICE:            エミリーの音声 (デフォルト ja-JP-NanamiNeural)"
