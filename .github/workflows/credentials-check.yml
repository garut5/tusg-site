name: Credentials check (手動、値を出さず有無だけ)

# ■ このワークフローの目的
#
# GitHub Actions の Secrets は書き込み専用で、設定した本人ですら値を
# 読み返せない。それゆえ、運用中に「何が入っていて何が足りないか」
# を確かめる手段が必要になる。
#
# ■ 絶対にしないこと
#
# 値を echo / printf / cat しない。GitHub の *** マスクは万能ではなく、
# 分割・加工されると素通りする (LOCOREACH_AI の教訓)。
# ここでは「set / unset」だけを出す。
#
# ■ 使い方
#
# Actions タブ → "Credentials check" → Run workflow
# → job の実行ログを開いて、各 Secret の有無を確認する

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 有無だけ一覧する (値は絶対に出さない)
        env:
          AUTOPOST_TRIGGER_TOKEN: ${{ secrets.AUTOPOST_TRIGGER_TOKEN }}
          AUTOPOST_LIVE: ${{ secrets.AUTOPOST_LIVE }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
        run: |
          set +x
          echo "== TUSG autopost credentials =="
          echo "(値そのものは出さず、set / unset と長さだけ表示します)"
          echo ""
          for name in AUTOPOST_TRIGGER_TOKEN AUTOPOST_LIVE NOTIFY_WEBHOOK; do
            val="${!name}"
            if [ -n "$val" ]; then
              # AUTOPOST_LIVE は値そのものが true/false のフラグなので、その旨だけ示す
              if [ "$name" = "AUTOPOST_LIVE" ]; then
                if [ "$val" = "true" ]; then
                  printf "  %-30s ✅ set (LIVE モード有効)\n" "$name"
                else
                  printf "  %-30s ✅ set (dry_run モード = 実投稿しない)\n" "$name"
                fi
              else
                printf "  %-30s ✅ set (%d chars)\n" "$name" "${#val}"
              fi
            else
              printf "  %-30s ❌ unset\n" "$name"
            fi
          done
          echo ""
          echo "== 補足 =="
          echo "  AUTOPOST_TRIGGER_TOKEN: POST /api/autopost/scheduled への Bearer トークン (Cloudflare と同じ値)"
          echo "  AUTOPOST_LIVE:          'true' で本番投稿、それ以外は dry_run"
          echo "  NOTIFY_WEBHOOK:         失敗時 Google Chat 通知先 (未設定なら通知しない、任意)"
