name = "tusg-site"
compatibility_date = "2025-01-01"
pages_build_output_dir = "public"

# 環境変数 (秘密でない値のみ。秘密は `wrangler pages secret put` で設定)
[vars]
# 既存のお問い合わせフォーム (contact.php.js)
CONTACT_TO_EMAIL = "info@tusg.co.jp"
CONTACT_FROM_EMAIL = "no-reply@mail.tusg.site"
CONTACT_FROM_NAME = "TUSGコーポレートサイト"
CONTACT_REDIRECT = "/thanks.html"

# 30秒無料診断 (functions/api/consultations.js)
RESEND_FROM_EMAIL = "no-reply@mail.tusg.site"
RESEND_FROM_NAME = "TUSGコーポレートサイト"
CONSULTATION_NOTIFICATION_TO = "info@tusg.co.jp"
# CONSULTATION_NOTIFICATION_CC = ""  # 必要時のみ設定
SITE_URL = "https://tusg.co.jp"

# Pay Forward 公開値
PAY_FORWARD_ENABLED = "true"            # D1 作成済・Pay Forward 公開 (Stripe は Phase 4b で接続)
STRIPE_API_VERSION = "2024-12-18.acacia"

# 管理画面 (/admin/) の API 側 allowlist
# Cloudflare Access で /admin/* を保護しているので一次ガードは Access が担うが
# 多重防御として Pages Function 側でも email を照合する
ADMIN_ALLOWED_EMAILS = "goandgoing53@gmail.com"

# Pay Forward LP / API のパスワード保護 (Stripe 本番決済 検証中のみ有効化)
# 空にすると公開モードになる (= 本番顧客受付開始)
# functions/_middleware.js で HTTP Basic 認証をかける
PAY_FORWARD_BASIC_AUTH_PASSWORD = "1234"

# 30秒無料診断 の秘密情報 (Cloudflare Dashboard または wrangler pages secret put で設定):
#   RESEND_API_KEY

# TUSG 自社メディア自動投稿 (functions/api/autopost/*.js)
# 詳細は docs/OWNED_MEDIA_AUTOPOST_2026-09.md 参照
# 以下はすべて Cloudflare Dashboard で Secret として設定済み:
#   META_APP_ID                       ex: 2153589091921280
#   INSTAGRAM_APP_ID                  ex: 1077407761327382
#   INSTAGRAM_APP_SECRET              (機密)
#   INSTAGRAM_BUSINESS_ACCOUNT_ID     ex: 17841436660255520 (@tusg_official)
#   INSTAGRAM_ACCESS_TOKEN            (機密 / 60日有効、失効前に refresh 必要)
# Threads 用 (2 本目 Meta アプリ tusg-threads-autopost 作成後に設定):
#   THREADS_APP_ID / THREADS_APP_SECRET / THREADS_ACCESS_TOKEN
#   THREADS_USER_ID (任意、未設定なら /me が使われる)

# 自動投稿の Bearer 認証トークン (Cron / manual トリガーで使用):
#   AUTOPOST_TRIGGER_TOKEN

# ----------------------------------------------------------------
# Pay Forward System (functions/api/pay-forward/*.js)
# 詳細は docs/pay-forward/README.md 参照
#
# 利用者が月額料金を決定するサブスクリプション基盤。
# Stripe は TUSG 専用アカウントのみ使用 (camomile 社の Stripe とは完全分離)。
#
# 以下の Secret を Cloudflare Dashboard または wrangler pages secret put で設定:
#   TUSG_STRIPE_SECRET_KEY            # sk_live_... (本番) / sk_test_... (テスト)
#   TUSG_STRIPE_WEBHOOK_SECRET        # whsec_...  (Webhook 署名検証)
#   TUSG_STRIPE_PUBLISHABLE_KEY       # pk_live_... / pk_test_... (フロント公開用)
#   ADMIN_ALERT_EMAIL                 # 管理者通知先 (決済失敗、quote 発行通知等)
#
# [vars] の公開値 (PAY_FORWARD_ENABLED / STRIPE_API_VERSION) は [vars] ブロックに追記済み

# ----------------------------------------------------------------
# D1 データベース (Pay Forward 本番データ用)
# 作成手順:
#   1) wrangler d1 create tusg-main
#   2) 返却された database_id を下記 database_id に貼る
#   3) wrangler d1 execute tusg-main --remote --file=migrations/pay-forward/0001_init.sql
#   4) wrangler d1 execute tusg-main --remote --file=migrations/pay-forward/0002_seed_assumptions.sql
#   5) wrangler d1 execute tusg-main --remote --file=migrations/pay-forward/0003_seed_services.sql
#   6) 下記ブロックのコメントアウトを外して deploy
#
[[d1_databases]]
binding = "TUSG_DB"
database_name = "tusg-main"
database_id = "093411f0-548e-472e-b60b-ffde91c29bd8"

# ----------------------------------------------------------------
# R2 バケット (テンプレ画像 / リール動画 のホスティング)
[[r2_buckets]]
binding = "AUTOPOST_ASSETS"
bucket_name = "tusg-autopost-assets"
