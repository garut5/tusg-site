<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay Forward 申込｜合同会社TUSG</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css?v=1786600000">
<link rel="stylesheet" href="/css/pay-forward.css?v=1">
<style>
  .pf-apply { max-width: 640px; margin: 40px auto; padding: 24px; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .pf-apply h1 { font-size: 1.6rem; margin-bottom: 8px; }
  .pf-apply .lead { color: #555; margin-bottom: 24px; font-size: 0.9rem; }
  .pf-apply label { display: block; margin-top: 16px; font-weight: 600; font-size: 0.9rem; }
  .pf-apply input, .pf-apply select, .pf-apply textarea { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; margin-top: 4px; font-size: 1rem; box-sizing: border-box; font-family: inherit; }
  .pf-apply input:focus, .pf-apply select:focus { border-color: #141924; outline: none; }
  .pf-apply .hint { color: #888; font-size: 0.8rem; margin-top: 4px; }
  .pf-apply .min-amount { background: #f5f7fb; padding: 12px; border-radius: 6px; margin-top: 12px; font-size: 0.9rem; }
  .pf-apply .min-amount b { color: #c0392b; }
  .pf-apply .submit { margin-top: 24px; width: 100%; padding: 14px; background: #141924; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .pf-apply .submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .pf-apply .error { background: #fdecea; border: 1px solid #f5c2c0; color: #a0220f; padding: 12px; border-radius: 6px; margin-top: 16px; font-size: 0.9rem; display: none; }
  .pf-apply .quote-mode { background: #eef5ff; border: 1px solid #c3d9f5; padding: 12px; border-radius: 6px; margin-top: 16px; font-size: 0.9rem; }
  .pf-apply .policy { margin-top: 24px; font-size: 0.78rem; color: #666; line-height: 1.6; }
  .pf-apply .policy a { color: #141924; text-decoration: underline; }
</style>
</head>
<body>
<main class="pf-apply">
  <h1>Pay Forward お申込み</h1>
  <p class="lead">月額料金はあなたが決めます。最低料金は原価と工数に基づいた金額で、下回ることはできません。</p>

  <div id="quote-banner" class="quote-mode" style="display:none;">
    <strong>個別見積モード</strong><br>
    管理者から発行された見積リンクでアクセスしています。
    最低料金・推奨料金はこの見積に基づいて適用されます。
  </div>

  <form id="apply-form" autocomplete="on">
    <label for="service">サービス <span style="color:#c0392b">*</span></label>
    <select id="service" name="service_slug" required>
      <option value="">読み込み中…</option>
    </select>
    <div class="hint" id="service-desc"></div>

    <div class="min-amount" id="min-amount-box" style="display:none;">
      最低料金: <b id="min-amount">—</b> / 月 (税抜)<br>
      <span id="recommended-amount" style="color:#555;"></span>
    </div>

    <label for="amount">あなたが決める月額 (税抜 円) <span style="color:#c0392b">*</span></label>
    <input id="amount" name="amount" type="number" step="100" min="100" required placeholder="例: 15000">
    <div class="hint">最低料金以上の整数で入力してください。</div>

    <label for="email">メールアドレス <span style="color:#c0392b">*</span></label>
    <input id="email" name="customer_email" type="email" required autocomplete="email">

    <label for="name">お名前</label>
    <input id="name" name="customer_name" type="text" autocomplete="name">

    <label for="company">会社名 (任意)</label>
    <input id="company" name="customer_company" type="text" autocomplete="organization">

    <label for="promo">プロモーションコード (任意)</label>
    <input id="promo" name="promotion_code" type="text" autocomplete="off" placeholder="テストクーポンがある場合のみ">
    <div class="hint">空欄の場合、決済画面でもコードを入力できます。</div>

    <div class="error" id="error-box"></div>

    <button type="submit" class="submit" id="submit-btn">Stripe で決済ページに進む</button>
  </form>

  <p class="policy">
    お申込みにより、
    <a href="/pay-forward/terms.html" target="_blank">利用規約</a>・
    <a href="/pay-forward/refund.html" target="_blank">キャンセル/返金ポリシー</a>・
    <a href="/compliance.html#privacy" target="_blank">プライバシーポリシー</a>
    に同意したものとみなします。
    決済は Stripe を通じて行われ、カード情報は TUSG に保存されません。
  </p>
</main>

<script>
(function() {
  const url = new URL(location.href);
  const quoteId = url.searchParams.get("quote");
  const quoteToken = url.searchParams.get("token");
  const isQuoteMode = Boolean(quoteId && quoteToken);
  if (isQuoteMode) document.getElementById("quote-banner").style.display = "block";

  const serviceSel = document.getElementById("service");
  const serviceDesc = document.getElementById("service-desc");
  const minBox = document.getElementById("min-amount-box");
  const minEl = document.getElementById("min-amount");
  const recEl = document.getElementById("recommended-amount");
  const amountInput = document.getElementById("amount");
  const errorBox = document.getElementById("error-box");
  const submitBtn = document.getElementById("submit-btn");

  let services = [];

  function fmt(n) {
    return Number(n || 0).toLocaleString("ja-JP") + " 円";
  }

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = "block";
    submitBtn.disabled = false;
    submitBtn.textContent = "Stripe で決済ページに進む";
  }
  function clearError() {
    errorBox.style.display = "none";
    errorBox.textContent = "";
  }

  function updateMinDisplay() {
    const slug = serviceSel.value;
    const svc = services.find((s) => s.slug === slug);
    if (!svc) {
      minBox.style.display = "none";
      serviceDesc.textContent = "";
      amountInput.min = 100;
      return;
    }
    serviceDesc.textContent = svc.short_description || "";
    const minAmount = svc.min_amount != null ? svc.min_amount : (svc.default_min_amount || null);
    if (minAmount) {
      minEl.textContent = fmt(minAmount);
      amountInput.min = minAmount;
      amountInput.placeholder = `例: ${minAmount}`;
      if (svc.recommended_amount) {
        recEl.textContent = `推奨: ${fmt(svc.recommended_amount)}`;
      } else {
        recEl.textContent = "";
      }
      minBox.style.display = "block";
    } else {
      minBox.style.display = "none";
    }
  }

  async function loadServices() {
    serviceSel.innerHTML = '<option value="">読み込み中…</option>';
    try {
      const url = `/api/pay-forward/services?_=${Date.now()}`;
      console.log("[pay-forward] fetching", url);
      const r = await fetch(url, { credentials: "include", cache: "no-store" });
      console.log("[pay-forward] response", r.status, r.statusText);
      if (!r.ok) {
        const txt = await r.text().catch(() => "");
        throw new Error(`API ${r.status}: ${txt.slice(0, 200) || r.statusText}`);
      }
      const data = await r.json();
      console.log("[pay-forward] data", data);
      if (!data.ok) throw new Error(data.message || "読み込みに失敗しました");
      services = data.services || [];
      if (services.length === 0) {
        serviceSel.innerHTML = '<option value="">公開中のサービスはまだありません</option>';
        submitBtn.disabled = true;
        return;
      }
      serviceSel.innerHTML = '<option value="">選択してください</option>' +
        services.map((s) => `<option value="${s.slug}">${s.name}</option>`).join("");
      serviceSel.addEventListener("change", updateMinDisplay);
    } catch (e) {
      console.error("[pay-forward] loadServices failed:", e);
      serviceSel.innerHTML = `<option value="">エラー: 読み込み失敗</option>`;
      submitBtn.disabled = true;
      showError(`サービス読み込みエラー: ${e.message} / F12で詳細確認`);
    }
  }

  loadServices();

  document.getElementById("apply-form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    clearError();
    submitBtn.disabled = true;
    submitBtn.textContent = "処理中…";

    const payload = {
      service_slug: serviceSel.value,
      amount: Number(amountInput.value),
      customer_email: document.getElementById("email").value.trim(),
      customer_name: document.getElementById("name").value.trim(),
      customer_company: document.getElementById("company").value.trim(),
      promotion_code: document.getElementById("promo").value.trim(),
    };
    if (isQuoteMode) {
      payload.quote_id = quoteId;
      payload.quote_token = quoteToken;
    }

    try {
      const r = await fetch("/api/pay-forward/checkout", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
        credentials: "include",
        cache: "no-store",
      });
      const data = await r.json();
      if (!data.ok) {
        throw new Error(data.message || `HTTP ${r.status}`);
      }
      location.href = data.checkout_url;
    } catch (e) {
      showError(e.message);
    }
  });
})();
</script>
</body>
</html>
